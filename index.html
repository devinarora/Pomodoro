<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e74c3c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
    <div class="container">
        <header>
            <button id="theme-toggle" aria-label="Toggle dark mode">☀️</button>
        </header>

        <main>
            <div class="timer-container">
                <svg class="timer-svg" viewBox="0 0 200 200">
                    <circle class="timer-bg" cx="100" cy="100" r="90"></circle>
                    <circle class="timer-progress" cx="100" cy="100" r="90"></circle>
                </svg>
                <canvas id="pixel-canvas" aria-hidden="true"></canvas>
                <div class="timer-display">
                    <span id="timer-text">25:00</span>
                    <span id="timer-status">Work</span>
                </div>
            </div>

            <div class="controls">
                <button id="start-btn" class="control-btn" aria-label="Start">▶</button>
                <button id="pause-btn" class="control-btn" aria-label="Pause" disabled>❚❚</button>
                <button id="reset-btn" class="control-btn" aria-label="Reset">↺</button>
            </div>

            <div class="settings">
                <div class="setting-group">
                    <label for="work-duration">Work Duration (minutes):</label>
                    <input type="number" id="work-duration" min="1" max="120" value="25">
                </div>
                <div class="setting-group">
                    <label for="break-duration">Break Duration (minutes):</label>
                    <input type="number" id="break-duration" min="1" max="60" value="5">
                </div>
                <div class="setting-group">
                    <label for="volume">Alarm Volume:</label>
                    <input type="range" id="volume" min="0" max="100" value="70">
                    <span id="volume-value">70%</span>
                </div>
                <div class="setting-group">
                    <label for="visual">Timer Visual:</label>
                    <select id="visual">
                        <option value="ring">Ring</option>
                        <option value="fisher">Fisherman</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label for="auto-start">Auto-start next session:</label>
                    <input type="checkbox" id="auto-start" checked>
                </div>
            </div>
        </main>

<script src="pixel-visual.js"></script>
<script src="app.js"></script>
</body>
</html>
